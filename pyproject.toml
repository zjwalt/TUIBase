[project]
name = "tuibase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.60.0",
  "asyncpg>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "textual-dev>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "screens/",
    "widgets/",
    "drivers/",
    "styles/",
]
